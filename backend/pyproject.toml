[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguard"
version = "0.1.0"
description = "Audit tool for LLM-simulated users with enforced limits"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "google-genai>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
worker = ["playwright>=1.48"]
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10"]

[tool.setuptools.packages.find]
include = ["vanguard*"]

[tool.setuptools.package-data]
vanguard = ["catalog/data/personas/*.json", "catalog/data/sites/*.json", "catalog/data/tasks/*.json", "executor/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is declared in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is kept as written, without wrapping.
"vanguard/agent/prompts.py" = ["E501"]
"vanguard/explain/__init__.py" = ["E501"]
"vanguard/verifier.py" = ["E501"]
