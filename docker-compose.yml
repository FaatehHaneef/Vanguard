# Start everything with: docker compose up --build
# Then open http://localhost:3000.
# Each test site brings its own compose.yml, included below; add a line here when a new
# site folder is created. Sites are ordinary websites with no knowledge of Vanguard.

include:
  - apps/tallowmere/compose.yml
  - sites/willowbrook-clinic/compose.yml
  - sites/northgate-library/compose.yml
  - sites/riverside-council/compose.yml
  - sites/emberline-kitchen/compose.yml
  - sites/marquee-tickets/compose.yml
  - sites/harbour-herald/compose.yml
  - sites/pantry-notes/compose.yml

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vanguard
      POSTGRES_PASSWORD: vanguard
      POSTGRES_DB: vanguard
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanguard"]
      interval: 5s
      retries: 10

  # The API runs trials in-process, so it uses the worker image (Playwright and Chromium).
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - path: .env
        required: false
    environment:
      VANGUARD_DATABASE_URL: postgresql+psycopg://vanguard:vanguard@db:5432/vanguard
      VANGUARD_DATA_DIR: /data
      VANGUARD_EXECUTOR: playwright
      # Sites keep their localhost addresses; the browser's requests go to each site's
      # service, as given by the catalog (Site.docker_host).
      VANGUARD_IN_DOCKER: "true"
    ports:
      - "8000:8000"
    volumes:
      - run-data:/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_VANGUARD_API: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db-data:
  run-data:
