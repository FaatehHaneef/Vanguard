# Start everything with: docker compose up --build
# Further test sites (sites/*) join this file as they are built.
# Then open http://localhost:3000.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vanguard
      POSTGRES_PASSWORD: vanguard
      POSTGRES_DB: vanguard
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanguard"]
      interval: 5s
      retries: 10

  # The API runs trials in-process for A3, so it uses the worker image (Playwright and
  # Chromium). A separate queue-fed worker process takes runs over later.
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - path: .env
        required: false
    environment:
      VANGUARD_DATABASE_URL: postgresql+psycopg://vanguard:vanguard@db:5432/vanguard
      VANGUARD_DATA_DIR: /data
      VANGUARD_EXECUTOR: playwright
      # Sites keep their localhost addresses; the browser's requests go to the containers.
      VANGUARD_ORIGIN_REWRITES: '{"http://localhost:3100": "http://tallowmere:3100", "http://localhost:3101": "http://willowbrook:3101", "http://localhost:3102": "http://northgate:3102"}'
    ports:
      - "8000:8000"
    volumes:
      - run-data:/data
    depends_on:
      db:
        condition: service_healthy
      tallowmere:
        condition: service_started
      willowbrook:
        condition: service_started
      northgate:
        condition: service_started

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_VANGUARD_API: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Test sites. Each is an ordinary website with no knowledge of Vanguard.
  tallowmere:
    build: ./apps/tallowmere
    env_file:
      - path: apps/tallowmere/.env.local
        required: false
    ports:
      - "3100:3100"

  willowbrook:
    build: ./sites/willowbrook-clinic
    ports:
      - "3101:3101"

  northgate:
    build: ./sites/northgate-library
    ports:
      - "3102:3102"

volumes:
  db-data:
  run-data:
