# Start everything with: docker compose up --build
# The web frontend (apps/web) and the Tallowmere test site (apps/tallowmere) join this
# file as their services are built.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vanguard
      POSTGRES_PASSWORD: vanguard
      POSTGRES_DB: vanguard
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanguard"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      VANGUARD_DATABASE_URL: postgresql+psycopg://vanguard:vanguard@db:5432/vanguard
      VANGUARD_DATA_DIR: /data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
